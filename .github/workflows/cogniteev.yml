name: Cogniteev build and publish

on:
  push:
    branches:
      - '*-cogniteev'
      - '*-COGNITEEV'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 17]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Publish
        env:
          PUBLISH_REPOSITORY_URL: ${{ vars.PUBLISH_REPOSITORY_URL }}
          GCP_AUTH: ${{ vars.GCP_AUTH }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ vars.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISH_REPOSITORY_URL}" ]; then
            echo "PUBLISH_REPOSITORY_URL is not set"
            exit 1
          fi
          if [ -n "${GCP_AUTH}" ]; then
            creds="${RUNNER_TEMP}/gcp-service-account.json"
            printf '%s\n' "${GCP_AUTH}" > "${creds}"
            export GOOGLE_APPLICATION_CREDENTIALS="${creds}"
          fi
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "GCP_AUTH or GOOGLE_APPLICATION_CREDENTIALS is not set"
            exit 1
          fi
          mvn -B --no-transfer-progress deploy -DskipTests
